<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Request Form — Inter-Branch Transfer (IBT)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #fde4d8; --header: #0b0b0b; --accent: #0078d4; --danger: #c42b1c; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: #1b1b1b; }
    header { background: var(--header); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 2px 0 0; font-size: 0.85rem; color: #d0d0d0; }
    .branch-bar { background: #1e1e1e; color: #fff; padding: 8px 24px; display: flex; gap: 12px; align-items: center; font-size: 0.9rem; }
    .branch-bar select, .branch-bar input { padding: 5px 10px; border-radius: 4px; border: none; }
    .container { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; padding: 18px 24px; max-width: 1400px; margin: auto; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    .search-box { grid-column: 1 / -1; }
    .search-box input { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
    #map { height: 470px; width: 100%; border-radius: 8px; border: 1px solid #ccc; z-index: 1; }
    .panel { display: flex; flex-direction: column; gap: 12px; }
    .summary-card { background: #fff; padding: 12px 16px; border-radius: 8px; border: 1px solid #e2c7b8; display: flex; flex-direction: column; gap: 6px; }
    .branch-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { padding: 8px 14px; border: none; border-radius: 5px; background: #9e9e9e; color: #fff; font-weight: 600; cursor: pointer; }
    .pill.active { background: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fff; padding: 14px; border-radius: 8px; border: 1px solid #e2c7b8; }
    .form-grid input, .form-grid textarea { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.92rem; }
    .full { grid-column: 1 / -1; }
    .error { color: var(--danger); font-weight: 600; font-size: 0.85rem; display: none; }
    button.submit { grid-column: 1 / -1; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.submit:disabled { background: #b5b5b5; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Stock Request Form</h1>
    <p>All Components — IBT (Inter-Branch Transfer)</p>
  </div>
  <div id="statusBadge" style="font-size:0.85rem;color:#7ee787;">Loading stock...</div>
</header>

<div class="branch-bar">
  <label for="myBranch"><strong>My Branch:</strong></label>
  <select id="myBranch"></select>
  <label for="branchPin" style="margin-left:auto;"><strong>Branch PIN:</strong></label>
  <input id="branchPin" type="password" placeholder="Enter PIN" style="width:120px;" />
</div>

<div class="container">
  <div class="search-box">
    <input id="partSearch" list="partList" placeholder="Search for an item..." />
    <datalist id="partList"></datalist>
  </div>

  <div id="map"></div>

  <div class="panel">
    <div class="summary-card">
      <div id="nearestText">📍 Select an item to locate nearest stock</div>
      <div id="totalStockText">📦 Total Network Stock: 0 units</div>
    </div>

    <div>
      <div style="font-size:0.85rem;font-weight:600;margin-bottom:6px;">Select Branch You Want Item From:</div>
      <div id="branchPills" class="branch-pills"></div>
    </div>

    <div class="form-grid">
      <input id="requesterName" placeholder="Requester Full Name *" class="full" />
      <input id="requestQty" type="number" min="1" placeholder="Request Quantity *" />
      <input id="jobCard" placeholder="Job Card Number *" />
      <textarea id="comments" rows="2" placeholder="Reason or special delivery instructions... *" class="full"></textarea>
      <div id="qtyError" class="error full"></div>
      <button id="btnSubmit" class="submit" disabled>Submit IBT Request</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const GET_STOCK_URL = "https://default0e23ddde1cba42eb9760e698ce0a9b.00.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/783eb2701d0e4d9abebdd53365a1d2d5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NdIeEnSrJDvDcv1rRnDqKAnTCr97V4CFz786nhr87zM";
  const SUBMIT_IBT_URL = "https://default0e23ddde1cba42eb9760e698ce0a9b.00.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/baeb00842bcb48e4a06ce24cf597c62d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Cb58LmCa9JeYcYYVQR7ZoMIHgszgByuzyjomZszUbDs";

  let stockData = [];
  let branches = {};
  let selectedPart = "";
  let selectedSourceBranch = null;

  const map = L.map('map').setView([-26.18, 28.22], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  const markersLayer = L.layerGroup().addTo(map);

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return +(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(1);
  }

  async function loadStock() {
    try {
      const res = await fetch(GET_STOCK_URL, {
        headers: { "x-branch-key": document.getElementById("branchPin").value || "INIT" }
      });
      stockData = await res.json();
      document.getElementById("statusBadge").textContent = `● Live (${stockData.length} rows)`;

      const parts = [...new Set(stockData.map(r => r.PartName).filter(Boolean))].sort();
      document.getElementById("partList").innerHTML = parts.map(p => `<option value="${p}">`).join("");

      stockData.forEach(r => {
        if (r.BranchLocation && r.Latitude && r.Longitude) {
          branches[r.BranchLocation] = { lat: Number(r.Latitude), lon: Number(r.Longitude) };
        }
      });
      const myBranchSel = document.getElementById("myBranch");
      myBranchSel.innerHTML = Object.keys(branches).sort().map(b => `<option value="${b}">${b}</option>`).join("");
      renderSelection();
    } catch (e) {
      document.getElementById("statusBadge").textContent = "⚠ Failed to load stock (check Flow URL)";
      document.getElementById("statusBadge").style.color = "#ff7b72";
    }
  }

  function renderSelection() {
    selectedPart = document.getElementById("partSearch").value.trim();
    selectedSourceBranch = null;
    markersLayer.clearLayers();

    const myCode = document.getElementById("myBranch").value;
    const home = branches[myCode];
    if (home) {
      L.circleMarker([home.lat, home.lon], { radius: 9, color: "#b00020", fillColor: "#ff1744", fillOpacity: 0.9 })
        .bindPopup(`<b>${myCode} (My Branch)</b>`).addTo(markersLayer);
    }

    const matches = stockData
      .filter(r => r.PartName === selectedPart && Number(r.QtyInStock) > 0)
      .map(r => ({
        ...r,
        dist: home ? haversineKm(home.lat, home.lon, Number(r.Latitude), Number(r.Longitude)) : 0
      }))
      .sort((a, b) => a.dist - b.dist);

    const totalUnits = matches.reduce((sum, r) => sum + Number(r.QtyInStock), 0);
    document.getElementById("totalStockText").textContent = `📦 Total Network Stock: ${totalUnits} units`;
    document.getElementById("nearestText").textContent = matches.length
      ? `📍 Nearest Stock: ${matches[0].BranchLocation} | ${matches[0].dist} km away (Stock: ${matches[0].QtyInStock})`
      : "📍 No branch stock available for this item";

    const pillsDiv = document.getElementById("branchPills");
    pillsDiv.innerHTML = "";
    const bounds = home ? [[home.lat, home.lon]] : [];

    matches.forEach(item => {
      bounds.push([Number(item.Latitude), Number(item.Longitude)]);
      L.marker([Number(item.Latitude), Number(item.Longitude)])
        .bindPopup(`<b>${item.BranchLocation}</b> | ${item.dist} km away<br>Stock: ${item.QtyInStock} | Bin: ${item.StorageLocation || 'N/A'}`)
        .addTo(markersLayer);

      const btn = document.createElement("button");
      btn.className = "pill";
      btn.textContent = `${item.BranchLocation} (${item.QtyInStock} avail • ${item.dist} km)`;
      btn.onclick = () => {
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        selectedSourceBranch = item;
        validateForm();
      };
      pillsDiv.appendChild(btn);
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [45, 45], maxZoom: 12 });
    validateForm();
  }

  function validateForm() {
    const qty = Number(document.getElementById("requestQty").value);
    const name = document.getElementById("requesterName").value.trim();
    const job = document.getElementById("jobCard").value.trim();
    const comments = document.getElementById("comments").value.trim();
    const errDiv = document.getElementById("qtyError");

    if (selectedSourceBranch && qty > Number(selectedSourceBranch.QtyInStock)) {
      errDiv.textContent = `⚠️ Requested quantity (${qty}) exceeds available stock (${selectedSourceBranch.QtyInStock})!`;
      errDiv.style.display = "block";
    } else {
      errDiv.style.display = "none";
    }

    const isValid = selectedPart && selectedSourceBranch && name && job && comments &&
                    qty > 0 && qty <= Number(selectedSourceBranch.QtyInStock);
    document.getElementById("btnSubmit").disabled = !isValid;
  }

  document.getElementById("btnSubmit").onclick = async () => {
    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.textContent = "Submitting Request...";

    const payload = {
      RowID: selectedSourceBranch.RowID,
      PartName: selectedPart,
      FromBranch: selectedSourceBranch.BranchLocation,
      ToBranch: document.getElementById("myBranch").value,
      QtyRequested: Number(document.getElementById("requestQty").value),
      CurrentStock: Number(selectedSourceBranch.QtyInStock),
      RequesterName: document.getElementById("requesterName").value.trim(),
      JobCardNumber: document.getElementById("jobCard").value.trim(),
      Comments: document.getElementById("comments").value.trim()
    };

    try {
      const res = await fetch(SUBMIT_IBT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-branch-key": document.getElementById("branchPin").value || ""
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Flow rejected request");
      alert(`✅ IBT Request submitted! ${payload.QtyRequested}x ${payload.PartName} requested from ${payload.FromBranch}.`);
      document.getElementById("requestQty").value = "";
      document.getElementById("jobCard").value = "";
      document.getElementById("comments").value = "";
      await loadStock();
    } catch (e) {
      alert("❌ Submission failed. Check your Branch PIN and Submit flow URL.");
    } finally {
      btn.textContent = "Submit IBT Request";
      validateForm();
    }
  };

  ["partSearch", "myBranch"].forEach(id => document.getElementById(id).addEventListener("change", renderSelection));
  ["requesterName", "requestQty", "jobCard", "comments"].forEach(id => document.getElementById(id).addEventListener("input", validateForm));
  loadStock();
</script>
</body>
</html>
