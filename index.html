<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Request Form — Inter-Branch Transfer (IBT)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #fde4d8; --header: #0b0b0b; --accent: #0078d4; --danger: #c42b1c; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: #1b1b1b; min-height: 100vh; }
    header { background: var(--header); color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 2px 0 0; font-size: 0.85rem; color: #d0d0d0; }

    /* PIN & Email Gate */
    #pinGate { max-width: 420px; margin: 64px auto; background: #fff; padding: 28px 24px; border-radius: 10px; border: 1px solid #e2c7b8; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    #pinGate h2 { margin: 0 0 20px; font-size: 1.25rem; text-align: center; }
    .field-group { margin-bottom: 14px; }
    .field-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
    #emailInput { width: 100%; padding: 11px 12px; font-size: 0.95rem; border: 1px solid #bbb; border-radius: 6px; }
    #pinInput { width: 100%; padding: 12px; font-size: 1.1rem; text-align: center; letter-spacing: 4px; border: 1px solid #bbb; border-radius: 6px; }
    #btnUnlock { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 6px; }
    #btnUnlock:disabled { background: #9bbad6; cursor: not-allowed; }
    #pinError { color: var(--danger); font-size: 0.88rem; font-weight: 600; margin-top: 10px; min-height: 20px; text-align: center; }

    /* Main App */
    #appView { display: none; }
    .branch-bar { background: #1e1e1e; color: #fff; padding: 8px 24px; display: flex; gap: 12px; align-items: center; font-size: 0.9rem; flex-wrap: wrap; }
    .branch-bar select, .btn-lock { padding: 5px 10px; border-radius: 4px; border: none; }
    .user-tag { font-size: 0.84rem; color: #cfcfcf; }
    .btn-lock { margin-left: auto; background: #333; color: #fff; cursor: pointer; font-size: 0.82rem; }
    .container { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; padding: 18px 24px; max-width: 1400px; margin: auto; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
    .search-box { grid-column: 1 / -1; }
    .search-box input { width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid #bbb; border-radius: 6px; background: #fff; }
    #map { height: 470px; width: 100%; border-radius: 8px; border: 1px solid #ccc; z-index: 1; }
    .panel { display: flex; flex-direction: column; gap: 12px; }
    .summary-card { background: #fff; padding: 12px 16px; border-radius: 8px; border: 1px solid #e2c7b8; display: flex; flex-direction: column; gap: 6px; }
    .branch-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill { padding: 8px 14px; border: none; border-radius: 5px; background: #9e9e9e; color: #fff; font-weight: 600; cursor: pointer; }
    .pill.active { background: var(--accent); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fff; padding: 14px; border-radius: 8px; border: 1px solid #e2c7b8; }
    .form-grid input, .form-grid textarea { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.92rem; }
    .full { grid-column: 1 / -1; }
    .error { color: var(--danger); font-weight: 600; font-size: 0.85rem; display: none; }
    button.submit { grid-column: 1 / -1; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button.submit:disabled { background: #b5b5b5; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Stock Request Form</h1>
    <p>All Components — IBT (Inter-Branch Transfer)</p>
  </div>
  <div id="statusBadge" style="font-size:0.85rem;color:#ffd27d;">Verification Required</div>
</header>

<section id="pinGate">
  <h2>Sign In</h2>

  <div class="field-group">
    <label for="emailInput">Email</label>
    <input id="emailInput" type="email" autocomplete="email" />
  </div>

  <div class="field-group">
    <label for="pinInput">PIN</label>
    <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" />
  </div>

  <button id="btnUnlock" type="button">Unlock IBT Portal</button>
  <div id="pinError"></div>
</section>

<main id="appView">
  <div class="branch-bar">
    <label for="myBranch"><strong>My Branch:</strong></label>
    <select id="myBranch"></select>
    <span id="signedInUser" class="user-tag"></span>
    <button id="btnLock" class="btn-lock" type="button">Lock / Switch User</button>
  </div>

  <div class="container">
    <div class="search-box">
      <input id="partSearch" list="partList" placeholder="Search for an item..." />
      <datalist id="partList"></datalist>
    </div>

    <div id="map"></div>

    <div class="panel">
      <div class="summary-card">
        <div id="nearestText">📍 Select an item to locate nearest stock</div>
        <div id="totalStockText">📦 Total Network Stock: 0 units</div>
        <div id="routeText">🛣️ Select a source branch pill to preview road route</div>
      </div>

      <div>
        <div style="font-size:0.85rem;font-weight:600;margin-bottom:6px;">Select Branch You Want Item From:</div>
        <div id="branchPills" class="branch-pills"></div>
      </div>

      <div class="form-grid">
        <input id="requesterName" placeholder="Requester Full Name *" class="full" />
        <input id="requestQty" type="number" min="1" placeholder="Request Quantity *" />
        <input id="jobCard" placeholder="Job Card Number *" />
        <textarea id="comments" rows="2" placeholder="Reason or special delivery instructions... *" class="full"></textarea>
        <div id="qtyError" class="error full"></div>
        <button id="btnSubmit" class="submit" disabled>Submit IBT Request</button>
      </div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const GET_STOCK_URL = "https://default0e23ddde1cba42eb9760e698ce0a9b.00.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/783eb2701d0e4d9abebdd53365a1d2d5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=NdIeEnSrJDvDcv1rRnDqKAnTCr97V4CFz786nhr87zM";
  const SUBMIT_IBT_URL = "https://default0e23ddde1cba42eb9760e698ce0a9b.00.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/baeb00842bcb48e4a06ce24cf597c62d/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Cb58LmCa9JeYcYYVQR7ZoMIHgszgByuzyjomZszUbDs";

  let requesterEmail = "";
  let stockData = [];
  let branches = {};
  let selectedPart = "";
  let selectedSourceBranch = null;
  let map = null;
  let markersLayer = null;
  let routeLayer = null;

  function getCurrentTimePin() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    return `${hh}${mm}`;
  }

  function isValidCompanyEmail(email) {
    return /^[^\s@]+@citylogistics\.co\.za$/i.test(email.trim());
  }

  function initMapIfNeeded() {
    if (!map) {
      map = L.map('map').setView([-26.18, 28.22], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      routeLayer = L.layerGroup().addTo(map);
    }
    setTimeout(() => map.invalidateSize(), 50);
  }

  function haversineKm(lat1, lon1, lat2, lon2) {
    const R = 6371, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return +(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))).toFixed(1);
  }

  function formatDuration(seconds) {
    const totalMins = Math.max(1, Math.round(seconds / 60));
    const hrs = Math.floor(totalMins / 60);
    const mins = totalMins % 60;
    return hrs > 0 ? `${hrs}h ${mins}m` : `${totalMins} min`;
  }

  async function drawRouteToBranch(home, item) {
    if (!routeLayer) return;
    routeLayer.clearLayers();
    const routeEl = document.getElementById("routeText");
    const myCode = document.getElementById("myBranch").value;

    if (!home || !item) {
      routeEl.textContent = "🛣️ Select a source branch pill to preview road route";
      return;
    }

    const fromLat = Number(item.Latitude), fromLon = Number(item.Longitude);
    const toLat = Number(home.lat), toLon = Number(home.lon);
    const fallbackCoords = [[fromLat, fromLon], [toLat, toLon]];

    routeEl.textContent = `🛣️ Calculating OSRM route (${item.BranchLocation} → ${myCode})...`;

    try {
      const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${fromLon},${fromLat};${toLon},${toLat}?overview=full&geometries=geojson`;
      const res = await fetch(osrmUrl);
      const data = await res.json();

      if (data.code === "Ok" && data.routes && data.routes[0]) {
        const route = data.routes[0];
        const latLngs = route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
        const roadKm = (route.distance / 1000).toFixed(1);
        const eta = formatDuration(route.duration);

        const polyline = L.polyline(latLngs, {
          color: "#0078d4",
          weight: 4.5,
          opacity: 0.9
        }).addTo(routeLayer);

        routeEl.textContent = `🛣️ OSRM Route (${item.BranchLocation} → ${myCode}): ${roadKm} km (~${eta})`;
        map.fitBounds(polyline.getBounds(), { padding: [45, 45], maxZoom: 12 });
        return;
      }
    } catch (e) {
      // Fallback to straight line if OSRM request fails
    }

    const fallbackLine = L.polyline(fallbackCoords, {
      color: "#0078d4",
      weight: 3,
      opacity: 0.85,
      dashArray: "6, 6"
    }).addTo(routeLayer);

    routeEl.textContent = `🛣️ Direct line (${item.BranchLocation} → ${myCode}): ${item.dist} km (OSRM unavailable)`;
    map.fitBounds(fallbackLine.getBounds(), { padding: [45, 45], maxZoom: 12 });
  }

  function resetSelectionKeepName() {
    selectedPart = "";
    selectedSourceBranch = null;
    document.getElementById("partSearch").value = "";
    document.getElementById("branchPills").innerHTML = "";
    document.getElementById("nearestText").textContent = "📍 Select an item to locate nearest stock";
    document.getElementById("totalStockText").textContent = "📦 Total Network Stock: 0 units";
    document.getElementById("routeText").textContent = "🛣️ Select a source branch pill to preview road route";
    document.getElementById("requestQty").value = "";
    document.getElementById("jobCard").value = "";
    document.getElementById("comments").value = "";
    document.getElementById("qtyError").style.display = "none";
    if (markersLayer) markersLayer.clearLayers();
    if (routeLayer) routeLayer.clearLayers();
    validateForm();
  }

  async function unlockWithPin() {
    const email = document.getElementById("emailInput").value.trim().toLowerCase();
    const pin = document.getElementById("pinInput").value.trim();
    const expectedPin = getCurrentTimePin();
    const errEl = document.getElementById("pinError");
    const btn = document.getElementById("btnUnlock");

    if (!isValidCompanyEmail(email)) {
      errEl.textContent = "Invalid email or PIN.";
      document.getElementById("emailInput").focus();
      return;
    }

    if (!/^\d{4}$/.test(pin) || pin !== expectedPin) {
      errEl.textContent = "Invalid email or PIN.";
      document.getElementById("pinInput").focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Loading Stock...";
    errEl.textContent = "";

    try {
      const res = await fetch(GET_STOCK_URL);
      if (!res.ok) throw new Error("Flow error");

      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("Empty stock response");
      }

      requesterEmail = email;
      stockData = data;
      branches = {};

      document.getElementById("pinGate").style.display = "none";
      document.getElementById("appView").style.display = "block";
      document.getElementById("signedInUser").textContent = `Signed in: ${requesterEmail}`;
      document.getElementById("statusBadge").textContent = `● Live (${stockData.length} rows)`;
      document.getElementById("statusBadge").style.color = "#7ee787";

      const parts = [...new Set(stockData.map(r => r.PartName).filter(Boolean))].sort();
      document.getElementById("partList").innerHTML = parts.map(p => `<option value="${p}">`).join("");

      stockData.forEach(r => {
        if (r.BranchLocation && r.Latitude && r.Longitude) {
          branches[r.BranchLocation] = { lat: Number(r.Latitude), lon: Number(r.Longitude) };
        }
      });

      const myBranchSel = document.getElementById("myBranch");
      myBranchSel.innerHTML = Object.keys(branches).sort().map(b => `<option value="${b}">${b}</option>`).join("");

      initMapIfNeeded();
      resetSelectionKeepName();
    } catch (e) {
      errEl.textContent = "Unable to connect.";
    } finally {
      btn.disabled = false;
      btn.textContent = "Unlock IBT Portal";
    }
  }

  function renderSelection() {
    selectedPart = document.getElementById("partSearch").value.trim();
    selectedSourceBranch = null;
    markersLayer.clearLayers();
    if (routeLayer) routeLayer.clearLayers();
    document.getElementById("routeText").textContent = "🛣️ Select a source branch pill to preview road route";

    const myCode = document.getElementById("myBranch").value;
    const home = branches[myCode];
    if (home) {
      L.circleMarker([home.lat, home.lon], { radius: 9, color: "#b00020", fillColor: "#ff1744", fillOpacity: 0.9 })
        .bindPopup(`<b>${myCode} (My Branch)</b>`).addTo(markersLayer);
    }

    const matches = stockData
      .filter(r => r.PartName === selectedPart && Number(r.QtyInStock) > 0)
      .map(r => ({
        ...r,
        dist: home ? haversineKm(home.lat, home.lon, Number(r.Latitude), Number(r.Longitude)) : 0
      }))
      .sort((a, b) => a.dist - b.dist);

    const totalUnits = matches.reduce((sum, r) => sum + Number(r.QtyInStock), 0);
    document.getElementById("totalStockText").textContent = `📦 Total Network Stock: ${totalUnits} units`;
    document.getElementById("nearestText").textContent = matches.length
      ? `📍 Nearest Stock: ${matches[0].BranchLocation} | ${matches[0].dist} km away (Stock: ${matches[0].QtyInStock})`
      : "📍 No branch stock available for this item";

    const pillsDiv = document.getElementById("branchPills");
    pillsDiv.innerHTML = "";
    const bounds = home ? [[home.lat, home.lon]] : [];

    matches.forEach(item => {
      bounds.push([Number(item.Latitude), Number(item.Longitude)]);
      L.marker([Number(item.Latitude), Number(item.Longitude)])
        .bindPopup(`<b>${item.BranchLocation}</b> | ${item.dist} km away<br>Stock: ${item.QtyInStock} | Bin: ${item.StorageLocation || 'N/A'}`)
        .addTo(markersLayer);

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pill";
      btn.textContent = `${item.BranchLocation} (${item.QtyInStock} avail • ${item.dist} km)`;
      btn.onclick = async () => {
        document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        selectedSourceBranch = item;
        validateForm();
        await drawRouteToBranch(home, item);
      };
      pillsDiv.appendChild(btn);
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [45, 45], maxZoom: 12 });
    validateForm();
  }

  function validateForm() {
    const qty = Number(document.getElementById("requestQty").value);
    const name = document.getElementById("requesterName").value.trim();
    const job = document.getElementById("jobCard").value.trim();
    const comments = document.getElementById("comments").value.trim();
    const errDiv = document.getElementById("qtyError");

    if (selectedSourceBranch && qty > Number(selectedSourceBranch.QtyInStock)) {
      errDiv.textContent = `⚠️ Requested quantity (${qty}) exceeds available stock (${selectedSourceBranch.QtyInStock})!`;
      errDiv.style.display = "block";
    } else {
      errDiv.style.display = "none";
    }

    const isValid = selectedPart && selectedSourceBranch && name && job && comments &&
                    qty > 0 && qty <= Number(selectedSourceBranch.QtyInStock);
    document.getElementById("btnSubmit").disabled = !isValid;
  }

  document.getElementById("btnSubmit").onclick = async () => {
    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.textContent = "Submitting Request...";

    const payload = {
      RowID: selectedSourceBranch.RowID,
      PartName: selectedPart,
      FromBranch: selectedSourceBranch.BranchLocation,
      ToBranch: document.getElementById("myBranch").value,
      QtyRequested: Number(document.getElementById("requestQty").value),
      CurrentStock: Number(selectedSourceBranch.QtyInStock),
      RequesterName: document.getElementById("requesterName").value.trim(),
      RequesterEmail: requesterEmail,
      JobCardNumber: document.getElementById("jobCard").value.trim(),
      Comments: document.getElementById("comments").value.trim()
    };

    try {
      const res = await fetch(SUBMIT_IBT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Flow rejected request");
      alert(`✅ IBT Request submitted! ${payload.QtyRequested}x ${payload.PartName} requested from ${payload.FromBranch}.`);
      resetSelectionKeepName();
    } catch (e) {
      alert("❌ Submission failed. Check SubmitIBT_Web flow and Response headers.");
      validateForm();
    } finally {
      btn.textContent = "Submit IBT Request";
    }
  };

  document.getElementById("btnUnlock").addEventListener("click", unlockWithPin);
  ["emailInput", "pinInput"].forEach(id => {
    document.getElementById(id).addEventListener("keydown", e => {
      if (e.key === "Enter") unlockWithPin();
    });
  });
  document.getElementById("btnLock").addEventListener("click", () => {
    requesterEmail = "";
    document.getElementById("pinInput").value = "";
    document.getElementById("pinError").textContent = "";
    document.getElementById("appView").style.display = "none";
    document.getElementById("pinGate").style.display = "block";
    document.getElementById("statusBadge").textContent = "Verification Required";
    document.getElementById("statusBadge").style.color = "#ffd27d";
  });

  ["partSearch", "myBranch"].forEach(id => document.getElementById(id).addEventListener("change", renderSelection));
  ["requesterName", "requestQty", "jobCard", "comments"].forEach(id => document.getElementById(id).addEventListener("input", validateForm));
</script>
</body>
</html>
